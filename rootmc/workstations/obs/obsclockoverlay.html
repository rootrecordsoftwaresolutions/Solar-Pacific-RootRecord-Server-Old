<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Local HST Clock</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
    }

    #clock {
      color: #f0f0f0;
      background: rgba(15, 15, 15, 0.75);
      padding: 14px 22px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
      text-align: center;
      white-space: nowrap;
    }

    .label {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .date {
      font-size: 18px;
      font-weight: 500;
      opacity: 0.9;
      margin-bottom: 6px;
    }

    .time {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <div id="clock">
    <div class="label">Local HST Time:</div>
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
  </div>

  <script>
    // ========== EASY SETTINGS ==========
    const USE_24_HOUR   = true;   // true = 24h | false = 12h AM/PM
    const SHOW_SECONDS  = true;   // true / false
    // ==================================

    const dateEl = document.getElementById("date");
    const timeEl = document.getElementById("time");

    function update() {
      const now = new Date();

      // Date (example: Saturday, August 15, 2026)
      dateEl.textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      // Time
      timeEl.textContent = now.toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        second: SHOW_SECONDS ? "2-digit" : undefined,
        hour12: !USE_24_HOUR
      });
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
