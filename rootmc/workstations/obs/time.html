<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ava Ivy Local Time Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .clock-container {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      min-width: 200px;
    }

    .date {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .time {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .timezone {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 3px;
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <div class="date" id="date">—</div>
    <div class="time" id="time">—:—:—</div>
    <div class="timezone">HST</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // Force Hawaii Standard Time (UTC-10, no DST)
      const optionsDate = {
        timeZone: 'Pacific/Honolulu',
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      };

      const optionsTime = {
        timeZone: 'Pacific/Honolulu',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };

      document.getElementById('date').textContent = now.toLocaleDateString('en-US', optionsDate);
      document.getElementById('time').textContent = now.toLocaleTimeString('en-US', optionsTime);
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
