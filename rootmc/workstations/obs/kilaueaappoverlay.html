<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kilauea Alerts Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    .bar {
      position: fixed;
      bottom: 40px;
      left: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(10, 10, 12, 0.92);
      border-radius: 12px;
      padding: 12px 18px 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    .accent {
      width: 4px;
      height: 42px;
      background: linear-gradient(to bottom, #ff5e3a, #ff9f1c);
      border-radius: 4px;
      flex-shrink: 0;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      font-size: 15px;
      font-weight: 650;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }

    .divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 4px;
    }

    .cta {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .cta-main {
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
    }

    .cta-sub {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="accent"></div>

    <div class="content">
      <div class="title">Kilauea Alerts</div>
      <div class="subtitle">Live volcano • quakes • weather</div>
    </div>

    <div class="divider"></div>

    <div class="cta">
      <div class="cta-main">Google Play</div>
      <div class="cta-sub">Free download</div>
    </div>
  </div>
</body>
</html>
