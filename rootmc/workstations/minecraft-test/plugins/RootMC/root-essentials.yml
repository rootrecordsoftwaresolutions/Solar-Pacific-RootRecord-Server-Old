wilderness-build-notify:
  enabled: true
  min-value: 1.0
  base-cooldown-seconds: 120
  high-value-threshold: 50.0
  high-value-cooldown-seconds: 30

wilderness-destroy-fee:
  enabled: true
  rate: 0.1
  min-worth: 1.0
  treasury-channel: service-fee:wilderness-destroy
  per-block-g: 1.0
  notify-bucket-seconds: 60
  ava-watch-114: true

# Gen1 → Gen2 (dedicated test host)
cross-server:
  home-tag: G1
  return-home: false
  return-settle-seconds: 12
  evacuate-on-stop: true
  evacuate-to: gen2
  evacuate-delay-ticks: 40
  gen1:
    enabled: false
    host: play.rootmc.net
    port: 25565
  gen2:
    enabled: true
    host: 51.81.176.61
    port: 24945
newbie-kit: starter
kits:
  starter:
    delay-seconds: -1
    items:
    - IRON_PICKAXE 1
    - IRON_AXE 1
    - IRON_SHOVEL 1
    - IRON_HOE 1
    - IRON_SWORD 1
    - BAKED_POTATO 16
    - OAK_LOG 16
    - TORCH 16
    - BREAD 16
server:
  motd:
  - '&d&lRootMC&r&7 — &fAge Of Ava Begins (test)'
  - '&7Singular RootMC · &fplay.rootmc.net'
  - '&7Currency is &fGold (G)&7. Redeem at the mint via &f/mint&7.'
  - '&7Start: &f/rules &7· &f/cmds &7· &f/vote'
  rules:
  - '&cNo cheating. &7No x-ray, dupes, macros, hacked clients, automation, or exploit
    abuse. Report bugs instead of using them.'
  - '&cNo harassment. &7No slurs, threats, sexual content toward players, targeted
    toxicity, or trying to drive people off the server.'
  - '&eRespect land. &7Do not grief claims, bypass protections, lava/water grief,
    or abuse wilderness edges to damage builds.'
  - '&eClaims matter. &7Claim or join protected land with &f/c&7. Local rules apply
    as long as they follow server rules.'
  - '&6Gold economy. &7Gold (G) is player-earned through mining, trade, shops, loans,
    bonds, and taxes. Do not fake markets or manipulate bugs.'
  - '&6Fair shops. &7Shop prices must stay within the configured market cap. Predatory
    pricing or bypass tricks can be removed.'
  - '&bPvP and conflict. &7PvP is limited by server settings and consent systems.
    Do not use traps or mechanics to bypass intended protections.'
  - '&bStaff tools. &7Do not ask for command cheats like /heal, /feed, /repair, or
    item spawning. Staff-only means staff-only.'
  - '&aGet help. &7Use chat or Discord for questions. Link with &f/link &7for stats,
    app features, and Discord verification.'
