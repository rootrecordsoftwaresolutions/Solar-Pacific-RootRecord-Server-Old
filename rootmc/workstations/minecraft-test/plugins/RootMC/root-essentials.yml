  keep-inventory: true
  skip-death-tax: false
  rtp-enabled: true
  rtp-cooldown-minutes: 15
  rtp-min-radius: 64
  rtp-max-radius: 900
  rtp-max-attempts: 24
  welcome:
  - ''
  - '&6&lWelcome to {server}, {player}.'
  - '&eRead first: &f/rules &7for conduct and land/economy basics.'
  - '&7Explore: &f/rtp &7to leave spawn, &f/map &7for the live map, &f/cmds &7only
    when you need more commands.'
  - '&aStarter grace: keep-inventory is on for 24 hours.'
  - ''
  rtp-world: world
  rtp-paid-after-grace: true
  rtp-base-fee: 5.0
  rtp-fee-rank-multiplier: 1.5

