# Root Essentials — plugins/RootMC/root-essentials.yml
# MySQL credentials: plugins/RootMC/database.yml

economy:
  starting-balance: 0
  currency-symbol: "G"
  worth:
    GOLD_INGOT: 1.0
    GOLD_NUGGET: 0.11
    DIAMOND: 25.0
    IRON_INGOT: 0.75
    EMERALD: 15.0

homes:
  default-name: "home"
  max:
    default: 3
    pro: 5
    lifetime: 8

spawn:
  world: "world"

teleport:
  warmup-seconds: 3
  combat-tag-seconds: 30

new-player:
  grace-hours: 24
  keep-inventory: true
  skip-death-tax: false
  rtp-enabled: true
  rtp-cooldown-minutes: 15
  rtp-min-radius: 500
  rtp-max-radius: 5000
  rtp-max-attempts: 24
