# RootMC-Official — plugins/RootMC/rootmc-official.yml
# Install on BOTH Towny and Claims. Each peer: block points at the other host's MySQL.
# Does NOT sync economy, shops, loans, homes, or inventories.
# Peer path is host-to-host MySQL — independent of Cloudflare / desktop edge.
#
# Claims role: peer = Towny database.yml; reward-claims/cmdtest usually false; mcmmo false if shared.
# Towny role: peer = Claims database.yml; reward-claims/cmdtest usually true; mcmmo false if shared.

enabled: false
role: towny

peer:
  host: ""
  port: 3306
  database: ""
  username: ""
  password: ""
  table-prefix: "root_"
  jdbc-params: "verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC"
  mcmmo-table-prefix: "mcmmo_"

sync:
  interval-seconds: 15
  on-join: true
  datasets:
    playtime: true
    votes: true
    reward-claims: true
    mcmmo: false
    perms-network: true
    activity: true
    cmdtest: true
    link-cache: true

tables:
  playtime: rootmc_playtime
  playtime-monthly: rootmc_playtime_monthly
