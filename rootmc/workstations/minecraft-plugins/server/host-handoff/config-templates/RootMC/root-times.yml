# Root-Times — plugins/RootMC/root-times.yml
# MySQL: plugins/RootMC/database.yml (via Root-Core)

minecraft-day:
  enabled: true
  # Any IANA zone id (e.g. UTC, America/New_York, Pacific/Honolulu)
  timezone: "UTC"
  length-minutes: 30
  midday-minute: 0
  midnight-minute: 15
  world: ""

harvest:
  playtime: true
  activity: true
  flush-interval-seconds: 60
  # Fallback player offset key until they have a row in activity_timezone (see PlayerTimezone keys)
  default-timezone-key: utc_plus_0

playtime:
  server-bucket: gen1

ip-lookup:
  enabled: true
  url-template: "http://ip-api.com/json/{ip}?fields=status,offset,timezone"
  cache-hours: 24

afk:
  enabled: true
  after-seconds: 300
  exclude-from-playtime: true
  exclude-from-activity: true
  broadcast: true

welcome:
  enabled: true
  delay-ticks: 40
  line-playtime: "&7Total Playtime: &f{playtime} &7- Your Current Time: &f{time} {timezone}"
  # {worldDay}/{dayId} = world fullTime/24000; {scheduleDay} = wall-clock cycle; {todTicks}/{phase} from world
  line-mc-day: "&7Minecraft day &f#{worldDay} &7- Ingame time: &f{todTicks} &7({phase})"

web:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  token: ""

cloud-status:
  enabled: false
  interval-seconds: 5

mysql-status:
  enabled: true
  interval-seconds: 5

tables:
  playtime: rootmc_playtime
  playtime-monthly: rootmc_playtime_monthly
  activity-timezone: activity_timezone
  activity-hourly: activity_hourly
  afk-sessions: times_afk_sessions
  times-status: times_status
