# Paste into BlueMap map .conf under marker-sets (matches root-admin.yml world-border.radius).
# Overworld / End: ±10000. Nether maps are not rendered on RootMC.
# https://bluemap.bluecolored.de/community/WorldBorder.html

marker-sets: {
  world-borders: {
    label: "World Border"
    toggleable: true
    default-hidden: false
    sorting: 0
    markers: {
      world-border: {
        type: "shape"
        label: "±10k border"
        position: { x: 0, y: 64, z: 0 }
        shape-y: 64
        shape: [
          { x: -10000, z: -10000 }
          { x:  10000, z: -10000 }
          { x:  10000, z:  10000 }
          { x: -10000, z:  10000 }
        ]
        line-color: { r: 255, g: 64, b: 64, a: 0.95 }
        fill-color: { r: 255, g: 64, b: 64, a: 0.08 }
        line-width: 3
        depth-test: false
      }
    }
  }
}
