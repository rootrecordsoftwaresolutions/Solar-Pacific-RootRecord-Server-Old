enabled: true

# ─── All gameplay metrics live here (edit + /c reload or restart) ───
limits:
  max-areas-per-player: 3
  max-level-per-area: 10
  # Slot 2+ requires that many prior areas at max level (set false to allow any order).
  require-prior-areas-at-max: true

anchors:
  radius-blocks: 16
  # Expansion anchors must be near the rim; placement always snaps exactly onto that edge.
  edge-tolerance-blocks: 3
  # Members may build/ally; only the area owner expands (raises level).
  allow-trusted-expansion: false

# Unclaimed wilderness band past the claim edge. Still wilderness (no build protection).
# Strangers cannot claim into this band. Owner + members are allied: they may skip
# wilderness destroy fees and do not trigger satellite alerts.
# Overlapping territories split 50/50 (nearest claim center). Y < 0 is never territory.
territory:
  buffer-blocks: 48
  satellite-alerts:
    enabled: true
    cooldown-seconds: 60

# Claims and territories apply at this Y and above. Below is free-reign mining rights.
mining:
  floor-y: 0

# Ava homestead is the public visit spawn (/c spawn Ava_Ivy).
spawn:
  ava-uuid: 78c3de61-0fd6-4800-9eda-cc178eaae34b
  ava-name: Ava_Ivy
  area-name: Ava
  auto-grant: true
  auto-public: true

economy:
  enabled: true
  # Founding costs for area slots 1 / 2 / 3… (wallet). Length can be any size ≤ max-areas.
  # Slot 1 = first claim (75 G). Expansions still charge the area bank. Slots 2+ stay paid.
  first-claim-price-g: 75.0
  area-prices-g: [75.0, 1000.0, 10000.0]
  # First-area bank seed from founding fee (capped at slot-1 price).
  first-claim-bank-seed-g: 25.0
  first-area-bank-seed-g: 25.0
  # Explicit expansion ladder (G): index 0 = level 1→2, 1 = 2→3, … If non-empty, overrides formula.
  # Example for 9 expansions to reach level 10:
  # expansion-prices-g: [75, 112.5, 168.75, 253.125, 379.688, 569.531, 854.297, 1281.445, 1922.168]
  expansion-prices-g: []
  # Used when expansion-prices-g is empty: price = base × multiplier^(currentLevel-1)
  expansion-base-price-g: 75.0
  expansion-multiplier: 1.5
  unclaim-refund-percent: 50.0
  treasury-channel: "service-fee:claim"

timings:
  confirm-ttl-seconds: 30
  spawn-cooldown-seconds: 3

protection:
  protect-containers: true
  protect-doors-buttons-and-redstone: true
  protect-entities: true
  protect-fire: true
  protect-explosions: true
  creeper-regeneration:
    enabled: true
    delay-seconds: 30
  protect-pistons: true
  protect-buckets: true

outline:
  enabled: true
  refresh-ticks: 40
  max-distance-blocks: 160
  points-per-circle: 64
  particle-size: 1.15
  contour-step: 2
  particle-spacing: 1.25

bluemap:
  enabled: true
  set-label: "Claims"
  shape-y: 64
  contour-step: 3
  line-width: 2
  fill-alpha: 0.28
  territory-enabled: true
  territory-fill-alpha: 0.12
  territory-line-width: 1

notifications:
  enabled: true

