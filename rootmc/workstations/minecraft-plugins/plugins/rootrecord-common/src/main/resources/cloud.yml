# Shared RootMC cloud credentials for ALL plugins.
# File: plugins/RootMC/cloud.yml
# MySQL: plugins/RootMC/database.yml
#
# Secrets live HERE (server-secret, Discord bot token). Public API base may also be set in root-core.yml.

cloud:
  api-base: "https://api.rootmc.net"
  server-id: ""
  server-secret: ""

# Discord — secrets + destinations for Paper JDA (chat bridge, log relay).
# Worker/API posts use Cloudflare wrangler DISCORD_ROOTMC_* vars, not this file.
discord:
  bot-token: ""
  guild-id: ""
  channels:
    ingame-chat: ""    # bidirectional MC ↔ Discord bridge
    server-logs: ""    # RootMC-Official hourly log uploads
  roles:
    linked: ""         # role required to speak into Minecraft from Discord

# Legacy aliases (still read if discord.* blank):
# Slack � #server-logs (C0BMX0QKSTS). Incoming Webhook (no Worker).
slack:
  server-logs-channel: "C0BMX0QKSTS"
  server-logs-webhook: ""

discord-chat:
  bot-token: ""
  guild-id: ""
  channel-id: ""       # → channels.ingame-chat
