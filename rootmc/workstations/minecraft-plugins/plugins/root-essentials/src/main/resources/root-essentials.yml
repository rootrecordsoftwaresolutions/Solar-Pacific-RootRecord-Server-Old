# Hold a torch (or other light items) to illuminate nearby blocks without placing them.
held-light:
  enabled: true
  level: 14
  tick-period: 2
  items:
    TORCH: 14
    SOUL_TORCH: 10
    REDSTONE_TORCH: 7
    LANTERN: 15
    SOUL_LANTERN: 10
    CAMPFIRE: 15
    SOUL_CAMPFIRE: 10
    JACK_O_LANTERN: 15
    SHROOMLIGHT: 15
    GLOWSTONE: 15
    SEA_LANTERN: 15

fees:
  survey: 25.0
  repair: 1000.0
  repair-all-per-item: 1000.0
  top: 10.0
  nick: 100.0
  hat: 1.0
  heal: 15.0
  feed: 15.0
  workbench: 1.0

wilderness-build-notify:
  enabled: true
  min-value: 1.0
  base-cooldown-seconds: 120
  high-value-threshold: 50.0
  high-value-cooldown-seconds: 30

wilderness-destroy-fee:
  enabled: true
  # True wilderness is Ava (guardian watch): 1 G/block → Server Reserve, recapped each minute.
  # Territory outsiders: 75% area-root claim bank / 25% Server Reserve. Owner + trusted exempt.
  # Y < 0 is free-reign mining (no claims, no fees). Cannot afford → break is cancelled.
  per-block-g: 1.0
  notify-bucket-seconds: 60
  treasury-channel: "service-fee:wilderness-destroy"
