# Root Essentials - plugins/RootMC/root-essentials.yml
# MySQL credentials: plugins/RootMC/database.yml

economy:
  # Wallet starting balance / true-reserve-opening live in root-economy.yml
  currency-symbol: "G"
  worth:
    GOLD_INGOT: 1.0
    GOLD_NUGGET: 0.11
    DIAMOND: 25.0
    IRON_INGOT: 0.75
    EMERALD: 15.0

homes:
  default-name: "home"
  max:
    default: 3
    pro: 5
    lifetime: 8

spawn:
  world: "world"

newbie-kit: starter
kits:
  starter:
    delay-seconds: -1
    items:
      - IRON_PICKAXE 1
      - IRON_AXE 1
      - IRON_SHOVEL 1
      - IRON_HOE 1
      - IRON_SWORD 1
      - BAKED_POTATO 16
      - OAK_LOG 16
      - TORCH 16
      - BREAD 16

# Shown by /motd (also a Root-Try).
server:
  motd:
    - "&6RootMC &8— &fplay.rootmc.net"
    - "&7Currency is &fGold (G)&7. Redeem at the mint peg via &f/mint&7."
    - "&7Start: &f/rules &7· &f/cmds &7· &f/try"
    - "&7Constitution &8» &bhttps://rootmc.net/wiki/constitution/"
  rules:
    - "&cNo cheating. &7No x-ray, dupes, macros, hacked clients, automation, or exploit abuse. Report bugs instead of using them."
    - "&cNo harassment. &7No slurs, threats, sexual content toward players, targeted toxicity, or trying to drive people off the server."
    - "&eRespect land. &7Do not grief claims/towns, bypass protections, lava/water grief, or abuse wilderness edges to damage builds."
    - "&eLand matters. &7Claim or join protected land. Local rules apply as long as they follow server rules."
    - "&6Gold economy. &7Gold (G) is player-earned through mining, trade, shops, loans, bonds, and taxes. Do not fake markets or manipulate bugs."
    - "&6Fair shops. &7Shop prices must stay within the configured market cap. Predatory pricing or bypass tricks can be removed."
    - "&bPvP and conflict. &7PvP is limited by server settings and consent systems. Do not use traps or mechanics to bypass intended protections."
    - "&bStaff tools. &7Do not ask for command cheats like /heal, /feed, /repair, or item spawning. Staff-only means staff-only."
    - "&aGet help. &7Use chat or Discord for questions. Link with &f/link &7for stats, app features, and Discord verification."

teleport:
  warmup-seconds: 3
  combat-tag-seconds: 30

new-player:
  grace-hours: 24
  keep-inventory: true
  skip-death-tax: false
  rtp-enabled: true
  # Always teleport into this world (not spawn_world / Multiverse hub).
  rtp-world: "world"
  rtp-cooldown-minutes: 15
  rtp-min-radius: 500
  rtp-max-radius: 5000
  rtp-max-attempts: 24
  # After starter grace: /rtp costs Gold (Explorer/basic = base; each rank × multiplier from prior).
  rtp-paid-after-grace: true
  rtp-base-fee: 5.0
  rtp-fee-rank-multiplier: 1.5
  welcome:
  - ''
  - '&6&lWelcome to {server}, {player}.'
  - '&eRead first: &f/rules &7for conduct and land/economy basics.'
  - '&7Explore: &f/rtp &7to leave spawn (free during starter grace), &f/map &7for the live map, &f/cmds &7only when you need more commands.'
  - '&cWilderness breaks cost &f1 G&c/block. Claim with &f/c claim&c or &f/c new&c asap, or ask someone to &f/c add&c you.'
  - '&7Mining rights: below Y 0 is free reign (no claims).'
  - '&aStarter grace: keep-inventory is on for 24 hours; /rtp is free until grace ends.'
  - ''

messages:
  prefix: ''
  new-player-grace-welcome: '&6&lWelcome to {server}. &7Start with &f/rules&7, &f/c claim&7 or &f/c new&7, &f/cmds&7, and &f/rtp&7. Wilderness breaks cost 1G. &aStarter grace: 24h.'
  players-only: '&cPlayers only.'
  no-permission: '&cYou do not have permission.'
  balance-self: '&7Balance: &6{balance} {currency}'
  balance-other: '&7{player} balance: &6{balance} {currency}'
  paytoggle-on: '&aIncoming payments &fon&a.'
