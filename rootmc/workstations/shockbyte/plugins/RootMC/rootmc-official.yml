# RootMC-Official — plugins/RootMC/rootmc-official.yml
# Dual-host peer sync retired. Singular live production = play.rootmc.net (Claims).
# Leave disabled unless Alex re-enables a peer relay intentionally.

enabled: false
role: claims

peer:
  host: ''
  port: 3306
  database: ''
  username: ''
  password: ''
  table-prefix: root_
  jdbc-params: verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
  mcmmo-table-prefix: mcmmo_

sync:
  interval-seconds: 60
  on-join: true
  datasets:
    playtime: true
    votes: true
    mcmmo: true
    perms-network: true
    activity: true
    cmdtest: true
    reward-claims: true
    link-cache: true
tables:
  playtime: rootmc_playtime
  playtime-monthly: rootmc_playtime_monthly
server-log-sync:
  enabled: true
  channel-id: ''
  interval-minutes: 60
  server-tag: ''
