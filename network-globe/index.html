<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live network activity globe driven by local network observations." />
  <title>Live Network Activity</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #globe { width: 100vw; height: 100vh; }
    .hud { position: fixed; top: 18px; left: 18px; min-width: 250px; max-width: 360px; padding: 14px 16px; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; background: rgba(0,0,10,.64); backdrop-filter: blur(12px); color: #e8e8ef; box-shadow: 0 14px 50px rgba(0,0,0,.35); pointer-events: none; }
    .title { font-size: 12px; letter-spacing: 1.6px; font-weight: 700; }
    .status { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 12px; color: #bdbdc7; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 13px; }
    .metric { display: flex; flex-direction: column; gap: 2px; }
    .metric span { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #797985; }
    .metric strong { font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 650; }
    .origin { margin-top: 12px; color: #8e8e9a; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .label { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); color: #9a9aa5; font-size: 11px; letter-spacing: 1.4px; display: flex; align-items: center; gap: 8px; pointer-events: none; user-select: none; }
    .embed .hud, .embed .label { display: none; }
    .help { position: fixed; right: 16px; bottom: 16px; color: #666673; font-size: 10px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="globe"></div>

  <section class="hud" id="hud">
    <div class="title">LIVE NETWORK ACTIVITY</div>
    <div class="status"><div class="dot" id="dot"></div><span id="status">CONNECTING</span></div>
    <div class="grid">
      <div class="metric"><span>Active flows</span><strong id="flows">0</strong></div>
      <div class="metric"><span>Endpoints</span><strong id="endpoints">0</strong></div>
      <div class="metric"><span>Packets/sec</span><strong id="pps">0</strong></div>
      <div class="metric"><span>Bytes/sec</span><strong id="bps">0 B/s</strong></div>
    </div>
    <div class="origin" id="origin">Origin: discovering network…</div>
  </section>

  <div class="label"><div class="dot"></div>REAL NETWORK OBSERVATIONS · NO SIMULATED TRAFFIC</div>
  <div class="help">drag to rotate · scroll to zoom</div>

  <script src="https://unpkg.com/globe.gl"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('embed') === '1') document.documentElement.classList.add('embed');

    const globe = Globe()(document.getElementById('globe'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundColor('#000011')
      .showAtmosphere(true)
      .atmosphereColor('#3a1c71')
      .atmosphereAltitude(0.18)
      .arcColor(d => d.color || ['#ff6b9d', '#ffffff'])
      .arcAltitude(d => d.altitude || 0.16)
      .arcStroke(d => d.stroke || 0.6)
      .arcDashLength(0.36)
      .arcDashGap(0.2)
      .arcDashAnimateTime(1700)
      .arcDashInitialGap(() => Math.random())
      .arcLabel(d => `${d.process || 'network'} · ${d.protocol?.toUpperCase() || ''} · ${d.endpoint || 'external network'}${d.port ? ':' + d.port : ''}<br>${d.city || ''}${d.city && d.country ? ', ' : ''}${d.country || ''}${d.org ? '<br>' + d.org : ''}`)
      .pointLabel(d => d.label || '')
      .pointColor(d => d.type === 'origin' ? '#ffffff' : '#ff6b9d')
      .pointAltitude(d => d.type === 'origin' ? 0.025 : 0.012)
      .pointRadius(d => d.type === 'origin' ? 0.55 : 0.3)
      .pointsMerge(false);

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.35;
    globe.controls().enableZoom = true;

    const statusEl = document.getElementById('status');
    const dotEl = document.getElementById('dot');
    const fmt = n => Number(n || 0).toLocaleString();
    const formatBytes = n => {
      n = Number(n || 0);
      if (n < 1024) return `${Math.round(n)} B/s`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB/s`;
      if (n < 1024 * 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB/s`;
      return `${(n / 1024 / 1024 / 1024).toFixed(1)} GB/s`;
    };

    function updateUi(data) {
      const s = data.stats || {};
      document.getElementById('flows').textContent = fmt(s.activeFlows);
      document.getElementById('endpoints').textContent = fmt(s.endpoints);
      document.getElementById('pps').textContent = Number(s.packetRate || 0).toFixed(1);
      document.getElementById('bps').textContent = formatBytes(s.bytesPerSec);
      document.getElementById('origin').textContent = `Origin: ${data.origin?.label || 'unknown'} · collector: ${s.collector || 'ss'}`;
    }

    let ws;
    let retry = 1000;
    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = location.hostname || 'localhost';
      ws = new WebSocket(`${protocol}//${host}:8081`);
      ws.onopen = () => {
        retry = 1000;
        statusEl.textContent = 'LIVE';
        dotEl.style.background = '#22c55e';
        dotEl.style.boxShadow = '0 0 10px #22c55e';
      };
      ws.onclose = () => {
        statusEl.textContent = 'RECONNECTING';
        dotEl.style.background = '#f59e0b';
        dotEl.style.boxShadow = '0 0 10px #f59e0b';
        setTimeout(connect, retry);
        retry = Math.min(8000, retry * 1.5);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = event => {
        try {
          const data = JSON.parse(event.data);
          if (data.type !== 'network-globe') return;
          globe.arcsData(data.arcs || []);
          globe.pointsData(data.points || []);
          updateUi(data);
        } catch (err) {
          console.warn('Bad network payload', err);
        }
      };
    }
    connect();
  </script>
</body>
</html>
